# Восстановление реального IP клиента.
#
# Цепочка запроса: клиент → (Cloudflare) → upper-proxy → этот nginx.
# Непосредственный пир для нас — верхний прокси, поэтому без этих директив
# $remote_addr равен его адресу, а не адресу клиента. От этого зависят:
#   - geo $is_payment_service в payments_ids.geo — фильтр вебхуков ЮKassa.
#     Пока $remote_addr не подменяется, geo всегда возвращает 0 и вебхуки
#     получают 403;
#   - статистика GoAccess — иначе все посетители схлопываются в один IP.
#
# real_ip_header может быть только один, поэтому читаем X-Forwarded-For, а не
# CF-Connecting-IP: последний ставит только Cloudflare, а нашим ближайшим пиром
# является верхний прокси. real_ip_recursive заставляет nginx идти по цепочке
# XFF справа налево, пропуская доверенные адреса и останавливаясь на первом
# недоверенном — это и есть реальный клиент.
#
# Подделать заголовок нельзя: верхний прокси дописывает фактический адрес пира
# справа через $proxy_add_x_forwarded_for, и разбор справа налево упирается
# именно в него, а не в то, что клиент прислал сам.

# --- Верхний прокси и внутренние сети Docker ---
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# --- Cloudflare IPv4 ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- Cloudflare IPv6 ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header X-Forwarded-For;
real_ip_recursive on;
