# Имя проекта задано явно. Compose выводит его из каталога compose-файла,
# и после переезда в deploy/ сеть и тома получили бы имена deploy_*, то есть
# были бы пересозданы. Фиксируем прежнее значение.
name: easysochipro

# Ограничение размера логов Docker: без него json-file растёт бесконечно
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- База данных ---
  db_easysochi:
    image: postgres:15
    container_name: postgres_db_easysochi
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # Порт открыт только на loopback сервера: снаружи база недоступна,
    # доступ из SQL-клиента идёт через SSH-туннель. Docker пишет правила
    # напрямую в цепочку DOCKER в iptables, минуя ufw, поэтому ограничение
    # host_ip здесь — единственная реальная защита.
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_easysochi:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - easysochipro_net

  # --- Сайт (Frontend) ---
  easysochi-site:
    # Тег задаётся переменной TAG, её проставляет ./scripts/build.sh
    # (по умолчанию — короткий хеш коммита). Откат на предыдущую сборку:
    #   TAG=<хеш> docker compose up -d
    image: easysochi/site:${TAG:-latest}
    build:
      context: ../easysochi-site
      dockerfile: docker/Dockerfile
    container_name: easysochi_site
    restart: unless-stopped
    volumes:
      - easysochipro_media:/usr/share/nginx/html/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - easysochipro_net

  # --- Бэкенд (API) ---
  contact_api:
    image: easysochi/contact-api:${TAG:-latest}
    build:
      context: ../easysochi-backend
      dockerfile: docker/Dockerfile
    user: "1000:1000"
    container_name: easysochi_contact_api
    restart: unless-stopped
    # Переменные перечислены поимённо: env_file: .env отдавал контейнеру весь
    # файл целиком, включая POSTGRES_PASSWORD, которым приложение не
    # пользуется — оно ходит в базу по DATABASE_URL.
    #
    # У необязательных переменных проставлены значения по умолчанию через
    # ${VAR:-default}. Без них отсутствующая в .env переменная приехала бы
    # в контейнер пустой строкой и перекрыла бы умолчание в коде: например
    # LOG_LEVEL="" уронил бы logging.basicConfig при старте.
    environment:
      # подключение к БД
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      # платёжная система
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-robokassa}
      - ROBOKASSA_SHOP_ID=${ROBOKASSA_SHOP_ID:-}
      - ROBOKASSA_PASSWORD_1=${ROBOKASSA_PASSWORD_1:-}
      - ROBOKASSA_PASSWORD_2=${ROBOKASSA_PASSWORD_2:-}
      - ROBOKASSA_TEST_MODE=${ROBOKASSA_TEST_MODE:-1}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      # уведомления и ссылки
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - DOMAIN_URL=${DOMAIN_URL}
      # логирование
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SQL_ECHO=${SQL_ECHO:-0}
    volumes:
      - easysochipro_media:/app/media
    depends_on:
      db_easysochi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      # запас на alembic upgrade head в entrypoint перед стартом uvicorn
      start_period: 40s
    logging: *default-logging
    networks:
      - easysochipro_net
        
  nginx:
    image: easysochi/nginx:${TAG:-latest}
    build:
      context: ../nginx
      dockerfile: docker/Dockerfile
    container_name: easysochi_nginx
    restart: unless-stopped
    ports:
      - "21500:21500"
    volumes:
      - easysochipro_logs:/var/log/nginx
      - easysochipro_stats:/var/www/stats
      - easysochipro_media:/var/www/media
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    # Нужны ровно две переменные — их подставляет envsubst в шаблон
    # conf.d/easysochi.conf.template. Раньше стоял env_file: .env, и nginx
    # получал заодно TELEGRAM_TOKEN, POSTGRES_PASSWORD и ключи платёжных
    # систем, которые ему не нужны и видны любому, кто сделает docker exec.
    environment:
      - DOMAIN_PRO=${DOMAIN_PRO}
      - PRO_STATS=${PRO_STATS}
    depends_on:
      easysochi-site:
        condition: service_healthy
      contact_api:
        condition: service_healthy
    logging: *default-logging
    networks:
      - easysochipro_net

  goaccess_pro:
    image: allinurl/goaccess
    container_name: goaccess_pro
    restart: always
    environment:
      - TZ=Europe/Moscow
    volumes:
      - easysochipro_logs:/opt/goaccess/logs:ro
      - easysochipro_stats:/var/www/stats
      - easysochipro_goaccess_db:/opt/goaccess/db
    command: >
      /opt/goaccess/logs/easysochi.pro_access.log
      --log-format=COMBINED
      --real-time-html
      --no-global-config
      --addr=0.0.0.0
      --port=7890
      --ws-url=wss://stats.easysochi.pro:443/ws
      --output=/var/www/stats/index.html
      --persist
      --restore
      --db-path=/opt/goaccess/db
    logging: *default-logging
    networks:
      - easysochipro_net

volumes:
  # БД GoAccess: обычный docker-том, каталог на хосте создавать не нужно
  easysochipro_goaccess_db:
    driver: local
  postgres_data_easysochi:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/easysochi_pro/postgres_data
  easysochipro_media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/easysochi_pro/media
  easysochipro_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/easysochi_pro/logs
  easysochipro_stats:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/easysochi_pro/stats
networks:
  easysochipro_net:
    driver: bridge
